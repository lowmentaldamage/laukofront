# Rules for laukofront. Values marked "upstream" are OpenFront's (see PLAN.md section 3);
# "ours" are laukofront's own. Every key is required: a missing or unknown key stops the game
# with a message naming it.

[game]
tick_hz = 10                    # upstream: one tick per 100 ms
spawn_phase_ticks = 100         # upstream: singleplayer spawn phase
spawn_immunity_ticks = 50       # upstream: DEFAULT_SPAWN_IMMUNITY_TICKS
min_spawn_distance = 30         # upstream: minDistanceBetweenPlayers (manhattan tiles)
spawn_radius = 4                # upstream: getSpawnTiles disk radius
win_percent = 80                # upstream: PERCENT_TILES_OWNED_TO_WIN

[map.small]                     # ours
width = 800
height = 500

[map.medium]
width = 1200
height = 750

[map.large]
width = 1600
height = 1000

[terrain]                       # ours: see docs/MAP_GENERATION.md
land_fraction = 0.5
octaves = 6
base_cells = 4.0
edge_fade = 0.45
mountain_exponent = 1.6
min_island_tiles = 60
min_lake_tiles = 40

[troops]                        # upstream: Config.troopCap / troopIncreaseRate / startManpower
human_start = 25000
bot_start = 10000
cap_multiplier = 2.0            # cap = cap_multiplier * (tiles^cap_tile_exponent * cap_tile_coeff + cap_base)
cap_tile_coeff = 1000.0
cap_tile_exponent = 0.6
cap_base = 50000.0
bot_cap_divisor = 3.0
growth_base = 10.0              # growth = (growth_base + troops^growth_exponent / growth_divisor) * (1 - troops / cap)
growth_exponent = 0.73
growth_divisor = 4.0
bot_growth_multiplier = 0.5

[gold]                          # upstream: goldAdditionRate
human_per_tick = 100
bot_per_tick = 50
starting_gold = 0

[attack]                        # upstream: attackAmount (share of troops the UI/bots send by default)
human_default_percent = 20
bot_default_percent = 5

[attack_logic]                  # upstream: EngineConfig attackLogic tunables and terrainAttackBase
plains_mag = 80.0
plains_cost = 16.5
highland_mag = 100.0
highland_cost = 20.0
mountain_mag = 120.0
mountain_cost = 25.0
large_territory_midpoint = 300000.0
large_territory_steepness = 2.5
large_attacker_depth = 0.7
large_defender_depth = 0.3
large_attacker_speed_depth = 0.73
bot_defender_loss_mult = 0.7
terra_nullius_cost_scale = 2000.0
terra_nullius_min_cost = 5.0
terra_nullius_max_cost = 100.0
attacker_loss_base = 0.463
cheapest_troop_ratio = 0.6
attacker_loss_per_density = 0.0039
speed_cost_divisor = 8.55
retreat_malus_percent = 25.0    # upstream: malusForRetreat (only when retreating from a player)
retreat_delay_ticks = 20        # upstream: RetreatExecution cancelDelay
conquer_bot_defender_cutoff_tiles = 100  # upstream: handleDeadDefender threshold
cluster_check_ticks = 20        # upstream: TICKS_PER_CLUSTER_CALC
hard_time_limit_seconds = 10200 # upstream: WinCheckExecution HARD_TIME_LIMIT_SECONDS (170 min)
