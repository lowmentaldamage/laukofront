# Rules for laukofront. Values marked "upstream" are OpenFront's (see PLAN.md section 3);
# "ours" are laukofront's own. Every key is required: a missing or unknown key stops the game
# with a message naming it.

[game]
tick_hz = 10                    # upstream: one tick per 100 ms
spawn_phase_ticks = 100         # upstream: singleplayer spawn phase
spawn_immunity_ticks = 50       # upstream: DEFAULT_SPAWN_IMMUNITY_TICKS
min_spawn_distance = 30         # upstream: minDistanceBetweenPlayers (manhattan tiles)
spawn_radius = 4                # upstream: getSpawnTiles disk radius
win_percent = 80                # upstream: PERCENT_TILES_OWNED_TO_WIN

[map.small]                     # ours
width = 800
height = 500

[map.medium]
width = 1200
height = 750

[map.large]
width = 1600
height = 1000

[terrain]                       # ours: see docs/MAP_GENERATION.md
land_fraction = 0.5
octaves = 6
base_cells = 4.0
edge_fade = 0.45
mountain_exponent = 1.6
min_island_tiles = 60
min_lake_tiles = 40
peak_share = 0.006               # highest share of land that becomes impassable peaks

[troops]                        # upstream: Config.troopCap / troopIncreaseRate / startManpower
human_start = 25000
bot_start = 10000
cap_multiplier = 2.0            # cap = cap_multiplier * (tiles^cap_tile_exponent * cap_tile_coeff + cap_base)
cap_tile_coeff = 1000.0
cap_tile_exponent = 0.6
cap_base = 50000.0
bot_cap_divisor = 3.0
growth_base = 10.0              # growth = (growth_base + troops^growth_exponent / growth_divisor) * (1 - troops / cap)
growth_exponent = 0.73
growth_divisor = 4.0
bot_growth_multiplier = 0.5

[gold]                          # upstream: goldAdditionRate
human_per_tick = 100
bot_per_tick = 50
starting_gold = 0

[attack]                        # upstream: attackAmount (share of troops the UI/bots send by default)
human_default_percent = 20
bot_default_percent = 5

[attack_logic]                  # upstream: EngineConfig attackLogic tunables and terrainAttackBase
plains_mag = 80.0
plains_cost = 16.5
highland_mag = 100.0
highland_cost = 20.0
mountain_mag = 120.0
mountain_cost = 25.0
large_territory_midpoint = 300000.0
large_territory_steepness = 2.5
large_attacker_depth = 0.7
large_defender_depth = 0.3
large_attacker_speed_depth = 0.73
bot_defender_loss_mult = 0.7
terra_nullius_cost_scale = 2000.0
terra_nullius_min_cost = 5.0
terra_nullius_max_cost = 100.0
attacker_loss_base = 0.463
cheapest_troop_ratio = 0.6
attacker_loss_per_density = 0.0039
speed_cost_divisor = 8.55
retreat_malus_percent = 25.0    # upstream: malusForRetreat (only when retreating from a player)
retreat_delay_ticks = 20        # upstream: RetreatExecution cancelDelay
conquer_bot_defender_cutoff_tiles = 100  # upstream: handleDeadDefender threshold
cluster_check_ticks = 20        # upstream: TICKS_PER_CLUSTER_CALC
hard_time_limit_seconds = 10200 # upstream: WinCheckExecution HARD_TIME_LIMIT_SECONDS (170 min)

[boats]                         # upstream: TransportShipExecution / boatMaxNumber / boatAttackAmount
max_transport_ships = 3
attack_share = 0.2              # default boat load: troops / 5
retreat_malus_percent = 25.0    # landing back on your own shore costs 25%
landing_search_distance = 50    # upstream closestReachableShore maxDist
trade_ship_interval_ticks = 300 # ours: each port launches a trade ship about every 30 s
trade_gold_scale = 75000.0      # upstream tradeShipGold: scale / (1 + e^(-0.03 (dist - midpoint))) + per_tile * dist
trade_gold_midpoint = 300.0
trade_gold_per_tile = 50.0

[buildings]                     # upstream: unitCost / unitInfo / cityTroopIncrease / defensePost*
city_troop_increase = 250000.0
base_cost = 125000              # city, port, factory: min(max_cost, 2^count * base_cost)
max_cost = 1000000
defense_post_cost_step = 50000  # defense post: min(250000, (count + 1) * 50000)
defense_post_max_cost = 250000
defense_post_range = 30
defense_post_defense_bonus = 5.0
defense_post_speed_bonus = 3.0
min_structure_distance = 15     # upstream structureMinDist
factory_interval_ticks = 100    # ours: each factory runs its trains every 10 s
factory_station_range = 110     # upstream trainStationMaxRange
train_gold_self = 10000         # upstream trainGold("self")
train_gold_min = 5000
train_gold_free_stops = 9
train_gold_stop_penalty = 5000
silo_cost = 1000000             # upstream MissileSilo cost (flat)
sam_cost_step = 1500000         # upstream SAM: min(3M, (count + 1) * 1.5M)
sam_max_cost = 3000000

[weapons]                       # upstream: unitCost / nukeMagnitudes / nukeSpeed / SAM / warship numbers
atom_cost = 750000
hydrogen_cost = 5000000
mirv_base_cost = 25000000
mirv_cost_step = 15000000       # per MIRV already launched in the match
atom_inner = 12
atom_outer = 30
hydrogen_inner = 80
hydrogen_outer = 100
warhead_inner = 12
warhead_outer = 18
nuke_speed = 10                 # tiles per tick (atom, hydrogen)
mirv_speed = 15
warhead_count = 350
mirv_spread = 250               # ours: warheads hit the target's land within this many tiles
silo_cooldown_ticks = 90        # per missile slot (slots = level)
sam_cooldown_ticks = 90
sam_max_range = 150.0           # SAM range = sam_max_range - 480 / (level + 5): 70 at level 1
nuke_targetable_range = 150     # SAMs can hit a nuke within this distance of its launch or target
warship_cost_step = 250000      # min(1M, (count + 1) * 250K)
warship_max_cost = 1000000
warship_health = 1000
warship_patrol_range = 100
warship_target_range = 130
warship_shot_range = 40         # ours: shells are instant within this range
warship_shot_interval = 20      # upstream warshipShellAttackRate
warship_capture_range = 5       # trade ships this close are captured
shell_damage = 250

[diplomacy]                     # upstream: Config / EngineConfig alliance, traitor, donation, target values
alliance_duration_ticks = 3000  # 5 minutes
alliance_request_duration_ticks = 200
alliance_request_cooldown_ticks = 300
alliance_extension_prompt_ticks = 300   # renew button shows 30 s before the alliance ends
traitor_duration_ticks = 300    # traitors defend at half strength for 30 s
donate_cooldown_ticks = 100
target_duration_ticks = 100
target_cooldown_ticks = 150
temporary_embargo_ticks = 3000
nuke_alliance_break_threshold = 100     # tiles of an ally in the blast that break the alliance
reaction_duration_ticks = 50    # ours: how long a reaction shows above the sender's land
