# AI difficulty table. See PLAN.md section 10 and docs/GAMEPLAY.md.
# attack_ratio: attack an enemy only when troops sent >= attack_ratio * defender troops.
# send_percent: share of (source troops - 1) sent per attack.
# reserve_troops: troops kept back on territories that border an enemy.

[easy]
think_interval_ticks = 20
attack_ratio = 2.0
send_percent = 50
reserve_troops = 0
prefer_cap_targets = false

[normal]
think_interval_ticks = 10
attack_ratio = 1.3
send_percent = 60
reserve_troops = 10
prefer_cap_targets = false

[hard]
think_interval_ticks = 10
attack_ratio = 1.15
send_percent = 80
reserve_troops = 30
prefer_cap_targets = true
