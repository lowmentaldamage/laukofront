[package]
name = "laukofront"
version = "1.0.1"
edition = "2021"
rust-version = "1.99"
description = "laukofront: a Rust port of the OpenFront territorial strategy engine."
license = "AGPL-3.0-only"
publish = false
default-run = "laukofront"

[dependencies]
bevy = "=0.20.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"

[profile.dev]
opt-level = 1

# Dependencies (mostly Bevy) are fully optimized even in dev builds so the game is playable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
