[package]
name = "openfront_clone"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "An OpenFront-style territorial conquest game written in Rust with Bevy."
license = "MIT"
publish = false
default-run = "openfront_clone"

[dependencies]
bevy = "=0.20.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.2.1"

[profile.dev]
opt-level = 1

# Dependencies (mostly Bevy) are fully optimized even in dev builds so the game is playable.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
